services:
  postgres:
    image: postgres:15-alpine
    container_name: rusrails_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: rusrails_development
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rusrails_development"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rusrails_network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rusrails_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@rusrails.local
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - rusrails_network
    profiles:
      - pgadmin  # Optional service, enable with: docker-compose --profile pgadmin up

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  rusrails_network:
    driver: bridge
